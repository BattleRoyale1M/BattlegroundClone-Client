; --- Runtime PSO precaching: predict + async-compile PSOs before first draw ---
r.PSOPrecaching=1
r.PSOPrecache.Components=1
r.PSOPrecache.Resources=1
r.PSOPrecache.GlobalShaders=1
; 1 = skip drawing a component until its precache PSOs are ready (pop-in, no hitch).
; 2 = draw with a fallback material meanwhile (static/skinned only) - needs a fallback material.
r.PSOPrecache.ProxyCreationStrategy=1

; --- Bundled shader pipeline cache: precompiled PSOs shipped inside the build ---
; bShareMaterialShaderCode is already ON by engine default (BaseGame.ini) - no need to set it.
; Recording + build loop: docs/2026-09-03-bundled-pso-cache-setup.md  (Tools/PSOCache/*.ps1)
; StartupMode: 0 = paused (resume from game code), 1 = 'Fast' (aggressive; use behind a
; loading screen), 2 = 'Background' (low priority; safe while there is no loading screen).
; No bundled cache is staged yet, so this does nothing today - it is forward-looking.
; Once the drop loading widget exists: switch to 1 and gate the widget on
; FShaderPipelineCache::NumPrecompilesRemaining() == 0.
r.ShaderPipelineCache.Enabled=1
r.ShaderPipelineCache.StartupMode=2

r.Streaming.PoolSize=800
r.Streaming.LimitPoolSizeToVRAM=1

